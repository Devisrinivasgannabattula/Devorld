spring.application.name=devorld-api
server.port=${PORT:8080}

# Oracle Database
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/orcl}
spring.datasource.username=${DB_USERNAME:DEVORLD}
spring.datasource.password=${DB_PASSWORD:Devorld123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JSON
spring.jackson.default-property-inclusion=non_null

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# JWT - local development only; replace before deployment
app.jwt.secret=${JWT_SECRET:DevorldLocalJwtSecretKey2026MustBeChanged}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
